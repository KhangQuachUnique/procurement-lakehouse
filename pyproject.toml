[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-lakehouse"
version = "0.2.0rc3"
description = "Data Lakehouse for public procurement analytics"
requires-python = ">=3.12,<3.15"

dependencies = [
    "dlt[filesystem,parquet]>=1.30,<2",
    "fsspec>=2026.7,<2027",
    "httpx>=0.28,<1",
    "psycopg2-binary>=2.9,<3",
    "pyarrow>=20,<26",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "rich>=13,<16",
    "s3fs>=2026.7,<2027",
    "sqlalchemy>=2,<2.1",
    "typer>=0.16,<1",
]

[project.scripts]
ingest = "procurement.cli.ingest:main"
silver = "procurement.silver.cli:main"
gold = "procurement.gold.cli:main"

[project.optional-dependencies]
metadata = [
    "sqlalchemy>=2,<2.1",
    "alembic>=1.16,<2",
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
orchestration = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
    # Dagster's PostgreSQL backend currently uses the psycopg2 driver.
    "sqlalchemy>=2,<2.1",
]
spark = [
    "pyspark==4.0.0",
]

[tool.dagster]
module_name = "procurement.orchestration.definitions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"procurement.gold" = ["*.json"]
"procurement.quality" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: real DLT/filesystem or isolated S3 integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
