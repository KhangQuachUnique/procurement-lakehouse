[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-lakehouse"
version = "0.1.0"
description = "Data Lakehouse for public procurement analytics"
requires-python = ">=3.12,<3.15"

dependencies = [
    "dlt[filesystem,parquet]>=1.30,<2",
    "duckdb>=1.5.5,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "s3fs>=2026.7,<2027",
]

[project.optional-dependencies]
metadata = [
    "sqlalchemy>=2,<2.1",
    "alembic>=1.16,<2",
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
ops = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]
orchestration = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
    # Dagster's PostgreSQL backend currently uses the psycopg2 driver.
    "sqlalchemy>=2,<2.1",
]

[tool.dagster]
module_name = "procurement.orchestration.definitions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"procurement.quality" = ["*.toml"]
"procurement.api.ops" = ["static/*.css", "static/*.js", "templates/*.html"]
"procurement.api" = ["benchmark_assets/*.html", "benchmark_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: real DLT/filesystem or isolated S3 integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
