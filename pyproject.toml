[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-lakehouse"
version = "0.1.0"
description = "Data Lakehouse for public procurement analytics"
requires-python = ">=3.12,<3.13"

dependencies = [
    "dlt[filesystem,parquet]>=1.30,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
ops = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
