name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Fast Test Suite (Ubuntu / Python 3.12)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra dev --extra ops --extra orchestration
      - name: Lint check with Ruff
        run: uv run --locked --no-sync ruff check .
      - name: Run unit & integration tests
        run: uv run --locked --no-sync pytest tests/gold/ tests/unit/gold/ tests/orchestration/
      - name: Validate Dagster definitions
        run: uv run --locked --no-sync python -c "from dagster import Definitions; from procurement.orchestration.definitions import defs; Definitions.validate_loadable(defs)"
      - name: Build wheel package
        run: uv build
